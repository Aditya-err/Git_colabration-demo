<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        canvas { display: block; touch-action: none; }
        .help {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1;
            padding: 10px 12px;
            color: #c8ffef;
            background: rgba(0, 20, 18, 0.64);
            border: 1px solid rgba(0, 255, 170, 0.45);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            pointer-events: none;
        }
        .help strong { color: #00ffaa; }
        .navigation {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 1;
            padding: 9px 12px;
            color: #c8ffef;
            background: rgba(0, 20, 18, 0.64);
            border: 1px solid rgba(0, 255, 170, 0.45);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            pointer-events: none;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="navigation">W/A/S/D or arrow keys: move<br>Q/E: move up/down</div>
    <div class="help"><strong>3D particle cube</strong><br>Drag: rotate 360° · Scroll: zoom · Right-drag: pan</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = false;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.enablePan = true;
        controls.screenSpacePanning = true;
        controls.rotateSpeed = 0.65;
        controls.zoomSpeed = 0.8;
        controls.minDistance = 40;
        controls.maxDistance = 240;
        controls.minPolarAngle = 0;
        controls.maxPolarAngle = Math.PI;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);

        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // A subtle frame makes the cube's 3D volume visible while rotating.
        const particlesPerEdge = Math.ceil(Math.pow(COUNT, 1 / 3));
        const spacing = 2.5;
        const cubeSize = (particlesPerEdge - 1) * spacing + spacing;
        const cubeFrame = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize)),
            new THREE.LineBasicMaterial({ color: 0x00aa88, transparent: true, opacity: 0.32 })
        );
        scene.add(cubeFrame);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        const pressedKeys = new Set();
        const moveDirection = new THREE.Vector3();
        const rightDirection = new THREE.Vector3();
        const movement = new THREE.Vector3();
        const upDirection = new THREE.Vector3(0, 1, 0);

        window.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            if (['w', 'a', 's', 'd', 'q', 'e', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                event.preventDefault();
                pressedKeys.add(key);
            }
        });

        window.addEventListener('keyup', (event) => {
            pressedKeys.delete(event.key.toLowerCase());
        });

        function moveCamera(delta) {
            if (pressedKeys.size === 0) return;

            camera.getWorldDirection(moveDirection);
            moveDirection.y = 0;
            moveDirection.normalize();
            rightDirection.crossVectors(moveDirection, upDirection).normalize();
            movement.set(0, 0, 0);

            if (pressedKeys.has('w') || pressedKeys.has('arrowup')) movement.add(moveDirection);
            if (pressedKeys.has('s') || pressedKeys.has('arrowdown')) movement.sub(moveDirection);
            if (pressedKeys.has('d') || pressedKeys.has('arrowright')) movement.add(rightDirection);
            if (pressedKeys.has('a') || pressedKeys.has('arrowleft')) movement.sub(rightDirection);
            if (pressedKeys.has('e')) movement.add(upDirection);
            if (pressedKeys.has('q')) movement.sub(upDirection);

            if (movement.lengthSq() > 0) {
                movement.normalize().multiplyScalar(28 * delta);
                camera.position.add(movement);
                controls.target.add(movement);
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime() * SPEED_MULT;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            moveCamera(delta);
            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const s = particlesPerEdge;
                 const sep = spacing; const off = ((s - 1) * sep) / 2;
                 let z = Math.floor(i / (s * s));
                 let y = Math.floor((i % (s * s)) / s);
                 let x = i % s;
                 target.set(x * sep - off, y * sep - off, z * sep - off);
                 color.setHex(0x00aaff);
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
